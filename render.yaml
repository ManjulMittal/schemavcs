# Render blueprint. Committing it means the deployment is reproducible from the repo
# rather than from a sequence of clicks nobody wrote down.
services:
  - type: web
    name: schemavcs
    runtime: docker
    plan: free                # 750 instance-hours/month; one service fits inside that
    dockerfilePath: ./Dockerfile

    # Not "/": the landing route creates a workspace and sets a cookie on every request
    # (D42/D46), so health checks against it would write a new repo per probe.
    healthCheckPath: /healthz

    envVars:
      # Only used if the Turso variables below are absent -- then the app falls back
      # to a local SQLite file, which on a free instance is lost on every restart.
      # With Turso set, nothing is written to the container's disk.
      - key: SCHEMAVCS_DATA
        value: /data

      # Set in the Render dashboard, not here. `sync: false` means the blueprint
      # declares that the variable is required without committing its value -- an auth
      # token in a repo is a leaked credential even in a private one.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
